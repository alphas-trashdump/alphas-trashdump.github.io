<script>
/* effect tier, decided before any CSS applies: rich = > 6 GB RAM (or ≥ 6 cores where memory is hidden) */
(function () {
  var q = new URLSearchParams(location.search).get("fx"), s = null, rich;
  try { s = localStorage.getItem("fx"); } catch (e) {}
  var pick = q || s;
  if (pick === "rich" || pick === "lite") rich = pick === "rich";
  else {
    var mem = navigator.deviceMemory, cores = navigator.hardwareConcurrency || 0;
    var rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var sd = navigator.connection && navigator.connection.saveData;
    rich = !rm && !sd && (mem != null ? mem > 6 : cores >= 6);
  }
  document.documentElement.dataset.fx = rich ? "rich" : "lite";
  if (q === "rich" || q === "lite") { try { localStorage.setItem("fx", q); } catch (e) {} }
})();
</script>

<link rel="icon" href="res/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="res/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-view="home" data-scrolled="0" data-nav="none">

<header class="top" id="top">
  <div class="shell top__in">
    <a class="top__btn top__back press" id="back" href="#/" aria-label="Back" data-icon="back"></a>
    <span class="top__title" id="top-title">alpha's trashdump</span>
    <a class="top__btn press" id="people-link" href="#/people" aria-label="Maintainers" data-icon="people"></a>
  </div>
</header>

<main class="shell" id="app">
  <div class="loading">
    <span class="spin spin--lg" role="status" aria-label="Loading builds">
      <svg viewBox="0 0 14 14">
        <circle class="spin__ring" cx="7" cy="7" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle class="spin__dot" cx="4.2" cy="7" r="1.4" fill="currentColor"/>
      </svg>
    </span>
    <span>Loading builds</span>
  </div>
  <noscript><div class="empty"><h3>JavaScript is off</h3><p>The build list needs it to render.</p></div></noscript>
</main>

<footer class="foot shell">
  <span>Community ports. Not affiliated with Xiaomi or OPPO.</span>
  <a href="#/people">Maintainers</a>
  <a href="?fx=lite" data-fx-toggle>Lite mode</a>
</footer>

<div class="lb" id="lb" data-open="0" role="dialog" aria-modal="true" aria-label="Screenshots">
  <div class="lb__track" id="lb-track"></div>
  <button class="lb__close press" id="lb-close" type="button" aria-label="Close">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="lb__count" id="lb-count"></div>
</div>

<div class="sheet" id="sheet" data-open="0" data-closing="0" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet__bg"></div>
  <div class="sheet__box" id="sheet-box">
    <span class="sheet__grip" aria-hidden="true"></span>
    <span class="sheet__ico" data-icon="send"></span>
    <h3 id="sheet-title">Opens in Telegram</h3>
    <p>This link only works with the Telegram app installed. Without it you get a login page instead of the file.</p>
    <span class="sheet__host" id="sheet-host"></span>
    <div class="sheet__acts">
      <button class="btn press" id="sheet-cancel" type="button">Cancel</button>
      <button class="btn btn--primary press" id="sheet-go" type="button">Open</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" data-show="0" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/app.js"></script>
