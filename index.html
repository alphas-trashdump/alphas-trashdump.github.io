<!-- theme + accent must be on <html> before the first paint, or the site
     flashes its defaults. Keep in sync with assets/js/lib/settings.js. -->
<script>
try{var s=JSON.parse(localStorage.getItem("trashdump:settings")||"{}"),r=document.documentElement;r.dataset.theme=s.theme==="light"?"light":"dark";r.dataset.accent=["orange","purple","blue","green"].indexOf(s.accent)>-1?s.accent:"orange";}catch(e){}
</script>

<script type="importmap">
{

<body data-view="home" data-scrolled="0" data-nav="none">

<!-- Boot splash. The app is a module graph that has to come off jsDelivr, so on a
     slow connection the first paint would otherwise be a bare page with two
     half-upgraded icon buttons in the corner. This covers the page until the app
     paints (or gives up), carries no text motion, and is centred. -->
<div class="boot" id="boot">
  <div class="boot__mark">
    <p class="boot__name">alpha&rsquo;s trashdump</p>
    <div class="boot__bar" aria-hidden="true"><i></i></div>
    <p class="boot__hint" id="boot-hint" role="status">Loading</p>
  </div>
</div>
<noscript><style>.boot{display:none!important}</style></noscript>

    <div class="top-bar__acts">

            <md-icon-button id="help-popup-close" class="help-popup__close" aria-label="Close help">

            </md-icon-button>

          <md-filled-button id="help-popup-go" class="help-popup__cta">

            Open Telegram Chat

<md-dialog class="alert" id="alert" type="alert" aria-describedby="alert-msg">
  <h2 slot="headline" id="alert-title"></h2>
  <div slot="content">
    <p id="alert-msg" class="t-body-medium muted"></p>
    <p id="alert-host" class="t-body-small alert__host"></p>
    <md-linear-progress id="alert-progress" class="alert__progress" indeterminate role="status" aria-label="Preparing link"></md-linear-progress>
  </div>
  <div slot="actions">
    <md-text-button id="alert-cancel">Cancel</md-text-button>
    <md-filled-button id="alert-go" disabled>Continue</md-filled-button>
  </div>
</md-dialog>

<div class="snackbar" id="toast" data-show="0" role="status" aria-live="polite"></div>

<!-- Splash fallback. Pure CSS cannot know whether app.js ever arrived, so this
     gives it a deadline: if the module graph is still not up after 8s the splash
     says so instead of spinning forever. app.js cancels the timer when it boots. -->
<script>
(function () {
  var hint = document.getElementById("boot-hint");
  setTimeout(function () {
    if (document.documentElement.dataset.booted) return;
    if (hint) hint.textContent = "Still loading — check your connection";
  }, 8000);
})();
</script>
<script type="module" src="assets/js/app.js?v=7"></script>
