<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101A20">
<title translate="no">alpha's trashdump</title>
<meta name="description" content="HyperOS, MIUI and ColorOS ports for Redmi 4X, 4, 4A, 3S, 5A and Note 5A.">
<link rel="canonical" href="https://alphas-trashdump.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="alpha's trashdump">
<meta property="og:description" content="HyperOS, MIUI and ColorOS ports for Xiaomi msm8937 devices.">
<meta property="og:url" content="https://alphas-trashdump.github.io/">
<meta name="twitter:card" content="summary">

<link rel="icon" href="res/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="res/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Latin/MiSansLatin-Light.min.css">
<link rel="stylesheet" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Latin/MiSansLatin-Regular.min.css">
<link rel="stylesheet" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Latin/MiSansLatin-Medium.min.css">
<link rel="stylesheet" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Latin/MiSansLatin-Semibold.min.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-view="home">

<header class="top">
  <div class="shell top__in">
    <a class="top__act top__back" href="#/" aria-label="Back" data-icon="back"></a>
    <a class="top__mark" href="#/">trashdump</a>
    <a class="top__act" href="#/people" aria-label="Maintainers" data-icon="people"></a>
  </div>
</header>

<main class="shell" id="app">
  <div class="loading">
    <span class="spin spin--lg spin--accent" role="status" aria-label="Loading builds">
      <svg viewBox="0 0 14 14">
        <circle class="spin__ring" cx="7" cy="7" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle class="spin__dot" cx="4.2" cy="7" r="1.4" fill="currentColor"/>
      </svg>
    </span>
    <span>Loading builds</span>
  </div>
  <noscript>
    <div class="empty">
      <h3>JavaScript is off</h3>
      <p>The build list needs JavaScript to render. Turn it on and reload.</p>
    </div>
  </noscript>
</main>

<footer class="foot shell">
  <div class="foot__row">
    <a href="#/people">Maintainers</a>
  </div>
</footer>

<div class="lb" id="lb" data-open="0" role="dialog" aria-modal="true" aria-label="Screenshots">
  <div class="lb__track" id="lb-track"></div>
  <button class="lb__close" id="lb-close" type="button" aria-label="Close">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"
      stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <div class="lb__count" id="lb-count"></div>
</div>

<div class="sheet" id="sheet" data-open="0" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet__bg"></div>
  <div class="sheet__box">
    <span class="sheet__ico">
      <svg class="ico ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l7 2.5L12.5 21z"
        stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <h3 id="sheet-title">Opens in Telegram</h3>
    <p>This link only works if the Telegram app is installed. Without it you will land on a
       login page instead of the file.</p>
    <span class="sheet__host" id="sheet-host"></span>
    <div class="sheet__acts">
      <button class="btn btn--primary btn--block" id="sheet-go" type="button">Open Telegram</button>
      <button class="btn btn--block" id="sheet-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" data-show="0" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
