<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title translate="no">alpha's trashdump</title>
<meta name="description" content="HyperOS, MIUI and ColorOS ports for Redmi 4X, 4, 4A, 3S, 5A and Note 5A.">
<link rel="canonical" href="https://alphas-trashdump.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="alpha's trashdump">
<meta property="og:description" content="HyperOS, MIUI and ColorOS ports for Xiaomi msm8937 devices.">
<meta property="og:url" content="https://alphas-trashdump.github.io/">
<meta name="twitter:card" content="summary">

<link rel="icon" href="res/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="res/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-view="home" data-scrolled="0" data-nav="none">

<header class="top" id="top">
  <div class="shell top__in">
    <a class="top__back" id="back" href="#/" aria-label="Back">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Back</span>
    </a>
    <span class="top__title notranslate" id="top-title" translate="no">alpha's trashdump</span>
    <a class="top__act" id="people-link" href="#/people" aria-label="Maintainers" data-icon="people"></a>
  </div>
</header>

<main class="shell" id="app">
  <div class="loading">
    <span class="spin spin--lg" role="status" aria-label="Loading builds">
      <svg viewBox="0 0 14 14">
        <circle class="spin__ring" cx="7" cy="7" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle class="spin__dot" cx="4.2" cy="7" r="1.4" fill="currentColor"/>
      </svg>
    </span>
    <span>Loading builds</span>
  </div>
  <noscript><div class="empty"><h3>JavaScript is off</h3><p>The build list needs it to render.</p></div></noscript>
</main>

<footer class="foot shell">
  <a href="#/people">Maintainers</a>
</footer>

<div class="lb" id="lb" data-open="0" data-closing="0" role="dialog" aria-modal="true" aria-label="Screenshots">
  <div class="lb__track" id="lb-track"></div>
  <button class="lb__close press" id="lb-close" type="button" aria-label="Close">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="lb__count" id="lb-count"></div>
</div>

<div class="alert" id="alert" data-open="0" data-closing="0" role="alertdialog" aria-modal="true"
     aria-labelledby="alert-title" aria-describedby="alert-msg">
  <div class="alert__bg"></div>
  <div class="alert__box">
    <div class="alert__body">
      <h3 id="alert-title"></h3>
      <p id="alert-msg"></p>
      <span class="alert__host" id="alert-host"></span>
    </div>
    <div class="alert__acts">
      <button type="button" id="alert-cancel">Cancel</button>
      <button type="button" id="alert-go" class="alert__pri">Continue</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" data-show="0" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
