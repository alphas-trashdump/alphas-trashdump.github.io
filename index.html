<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha's trashdump</title>
    <script>
        (function() {
            var mem = navigator.deviceMemory;
            var cpu = navigator.hardwareConcurrency;
            if ((mem && mem <= 4) || (cpu && cpu <= 4)) {
                document.documentElement.classList.add('low-end-device');
            }
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.33.0/minified.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: {
                    sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    serif: ['"Instrument Serif"', 'ui-serif', 'Georgia', 'serif'],
                }
            } }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% -20%, #27272a 0%, #050505 80%);
            background-attachment: fixed;
            color: #f4f4f5;
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            font-feature-settings: "cv11", "ss01";
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        .serif-display { font-family: 'Instrument Serif', ui-serif, Georgia, serif; letter-spacing: -0.01em; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        #fallback { padding: 2rem; text-align: center; color: #a1a1aa; font-size: 13px; }
        
        .low-end-device * {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            filter: none !important;
        }
        .low-end-device [class*="blur-"]:not([class*="backdrop-blur"]) {
            display: none !important;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>
<body>
    <div id="root"><div id="fallback">Loading…</div></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const DEMO_DATA = [];

        const baseSvg = (size=16) => ({
            xmlns:"http://www.w3.org/2000/svg", width:size, height:size, viewBox:"0 0 24 24",
            fill:"none", stroke:"currentColor", strokeWidth:1.8, strokeLinecap:"round", strokeLinejoin:"round"
        });
        const IconPaperPlane = ({size=18}) => <svg {...baseSvg(size)}><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>;
        const IconDownload = ({size=14}) => <svg {...baseSvg(size)}><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>;
        const IconBolt = ({size=14}) => <svg {...baseSvg(size)}><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>;
        const IconGallery = ({size=14}) => <svg {...baseSvg(size)}><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m21 16-5-5L5 21"/></svg>;
        const IconArrowRight = ({size=14}) => <svg {...baseSvg(size)}><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>;
        const IconBack = ({size=14}) => <svg {...baseSvg(size)}><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>;
        const IconExternal = ({size=12}) => <svg {...baseSvg(size)}><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>;
        const IconUser = ({size=12}) => <svg {...baseSvg(size)}><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconLink = ({size=13}) => <svg {...baseSvg(size)}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
        
        const IconTerminal = ({size=14}) => <svg {...baseSvg(size)}><path d="m4 5 6 6-6 6"/><path d="M12 19h8"/></svg>;
        const IconFileText = ({size=14}) => <svg {...baseSvg(size)}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>;
        const IconBug = ({size=14}) => <svg {...baseSvg(size)}><rect width="8" height="14" x="8" y="6" rx="4"/><path d="m19 7-3 2"/><path d="m5 7 3 2"/><path d="m19 19-3-2"/><path d="m5 19 3-2"/><path d="M20 13h-4"/><path d="M4 13h4"/><path d="m10 4 1 2"/><path d="m14 4-1 2"/></svg>;
        const IconBadge = ({size=12}) => <svg {...baseSvg(size)}><path d="m9 12 2 2 4-4"/><path d="M12 2 4 6v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10V6l-8-4Z"/></svg>;
        const IconStack = ({size=14}) => <svg {...baseSvg(size)}><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>;

        const isTelegramLink = (url) => {
            if (!url) return false;
            try { 
                const u = new URL(url); 
                return u.hostname === 't.me' || u.hostname.endsWith('.t.me'); 
            }
            catch (e) {
                return /(^|\/\/)t\.me\//i.test(url); 
            }
        };
        let openTelegramPrompt = null;

        const SmartLink = ({ href, children, className, title }) => {
            const handleClick = (e) => {
                if (isTelegramLink(href)) { e.preventDefault(); if (openTelegramPrompt) openTelegramPrompt(href); }
            };
            return <a href={href} target="_blank" rel="noopener noreferrer" onClick={handleClick} className={className} title={title}>{children}</a>;
        };

        let PROFILES = {};
        const Maintainer = ({ name, link, id }) => {
            const profile = id ? PROFILES[id] : null;
            const label = (profile && profile.displayName) || name || "Unknown";
            const inner = (<><IconUser size={12}/><span>{label}</span></>);
            const cls = "inline-flex items-center gap-1.5 text-zinc-300 hover:text-white transition-colors";
            if (profile) return <a href={`#/maintainer/${profile.id}`} className={cls}>{inner}</a>;
            if (link) return <SmartLink href={link} className={cls}>{inner}</SmartLink>;
            return <span className="inline-flex items-center gap-1.5 text-zinc-500">{inner}</span>;
        };

        const TelegramModal = ({ url, onClose }) => {
            useEffect(() => { document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = 'unset'; }; }, []);
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-md"></div>
                    <div className="relative w-full max-w-sm rounded-xl bg-zinc-900/90 backdrop-blur-xl border border-white/10 p-5 shadow-2xl" onClick={(e)=>e.stopPropagation()}>
                        <div className="flex items-center gap-3 mb-3">
                            <div className="w-8 h-8 rounded-full bg-white/10 border border-white/5 flex items-center justify-center text-white"><IconPaperPlane size={16} /></div>
                            <h3 className="text-sm font-semibold text-zinc-50">View on Telegram</h3>
                        </div>
                        <p className="text-xs text-zinc-400 leading-relaxed mb-6">Continue in the Telegram app to access this content.</p>
                        <div className="flex justify-end gap-2">
                            <button onClick={onClose} className="px-3 py-2 text-xs rounded-lg border border-white/10 text-zinc-300 hover:bg-white/5 hover:text-white transition-all">Cancel</button>
                            <a href={url} target="_blank" rel="noopener noreferrer" onClick={onClose}
                               className="inline-flex items-center gap-2 px-3 py-2 text-xs rounded-lg bg-zinc-100 text-zinc-950 hover:bg-white transition-all font-medium">
                                Continue <IconExternal size={12} />
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        const DownloadBtn = ({ href, title, icon, variant, className = "" }) => {
            const cls = variant === 'ghost'
                ? `flex items-center justify-center w-full gap-1.5 px-3 py-2.5 text-[11px] font-medium rounded-lg border border-white/10 text-zinc-300 active:bg-white/10 transition-all backdrop-blur-sm ${className}`
                : `flex items-center justify-center w-full gap-1.5 px-3 py-2.5 text-[11px] font-medium rounded-lg bg-zinc-100 text-zinc-950 active:bg-white transition-all shadow-[0_0_15px_rgba(255,255,255,0.1)] ${className}`;
            return <SmartLink href={href} className={cls}>{icon}{title}</SmartLink>;
        };

        const parseHash = () => {
            const h = window.location.hash.replace(/^#\/?/, '');
            if (!h) return { view: 'home' };
            const parts = h.split('/').filter(Boolean);
            if (parts[0] === 'device' && parts[1]) {
                if (parts[2] === 'rom' && parts[3]) return { view: 'rom', deviceId: parts[1], romId: parts[3] };
                return { view: 'device', deviceId: parts[1] };
            }
            if (parts[0] === 'maintainer' && parts[1]) return { view: 'maintainer', maintainerId: parts[1] };
            return { view: 'home' };
        };

        const Header = () => (
            <header className="sticky top-0 z-30 border-b border-white/10 bg-black/40 backdrop-blur-xl">
                <div className="w-full px-4 py-3 flex items-center justify-between">
                    <a href="#" className="text-sm font-semibold text-zinc-100 active:text-white transition-colors">Alpha's trashdump</a>
                    <SmartLink href="https://t.me/alpha269" className="inline-flex items-center gap-1.5 text-[11px] font-medium text-zinc-400 active:text-zinc-100 transition-colors">
                        Contact <IconExternal size={10} />
                    </SmartLink>
                </div>
            </header>
        );

        const SectionLabel = ({ children }) => (
            <h2 className="serif-display text-5xl text-zinc-50 mb-6 drop-shadow-sm px-4">{children}</h2>
        );

        const Breadcrumb = ({ items }) => (
            <nav className="mb-6 flex items-center gap-1.5 text-[11px] font-medium text-zinc-500 overflow-x-auto whitespace-nowrap custom-scrollbar pb-1 px-4">
                {items.map((it, i) => (
                    <React.Fragment key={i}>
                        {i > 0 && <span className="text-zinc-700">/</span>}
                        {it.href
                            ? <a href={it.href} className="active:text-zinc-300 transition-colors">{it.label}</a>
                            : <span className="text-zinc-300">{it.label}</span>}
                    </React.Fragment>
                ))}
            </nav>
        );

        const DeviceCard = ({ device }) => (
            <a
                href={`#/device/${device.id}`}
                className="block p-5 rounded-xl border border-white/10 bg-white/[0.02] backdrop-blur-lg active:bg-white/[0.04] active:border-white/20 transition-all duration-300"
            >
                <div className="flex items-start justify-between gap-4">
                    <div className="min-w-0 flex-1">
                        <div className="text-lg font-medium text-zinc-100 leading-snug">{device.name}</div>
                        <div className="text-[11px] text-zinc-400 mt-1 font-mono">{device.codename}</div>
                    </div>
                    <span className="shrink-0 text-zinc-600 mt-1"><IconArrowRight size={16}/></span>
                </div>
                <div className="mt-5 pt-3 border-t border-white/5 text-[11px] font-medium text-zinc-500">
                    {device.roms.length} ROM{device.roms.length !== 1 ? 's' : ''}
                </div>
            </a>
        );

        const RomCard = ({ rom, deviceId }) => (
            <a
                href={`#/device/${deviceId}/rom/${rom.id}`}
                className="block p-5 rounded-xl border border-white/10 bg-white/[0.02] backdrop-blur-lg active:bg-white/[0.04] active:border-white/20 transition-all duration-300"
            >
                <div className="flex items-start justify-between gap-4">
                    <div className="min-w-0 flex-1">
                        <div className="text-base font-medium text-zinc-100 leading-snug">{rom.name}</div>
                        <div className="text-[11px] text-zinc-400 mt-1.5 flex items-center gap-1.5 flex-wrap">
                            <span className="font-mono bg-white/5 px-1 py-0.5 rounded">{rom.fileSize}</span>
                            <span className="text-zinc-700">·</span>
                            <span>{rom.buildDate}</span>
                        </div>
                    </div>
                    <span className="shrink-0 text-[9px] font-medium px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-white/10">Android {rom.androidVersion}</span>
                </div>
                <div className="mt-4 pt-3 border-t border-white/5 text-[11px] text-zinc-500 flex items-center justify-between">
                    <Maintainer name={rom.maintainer} link={rom.maintainerLink} id={rom.maintainerId} />
                    <span className="text-zinc-600"><IconArrowRight size={14}/></span>
                </div>
            </a>
        );

        const HomeView = ({ devices }) => (
            <section className="w-full py-2">
                <SectionLabel>Devices</SectionLabel>
                {devices.length === 0 ? (
                    <div className="p-8 mx-4 text-center text-xs text-zinc-500 border border-white/10 bg-white/5 rounded-xl backdrop-blur-sm">No devices yet.</div>
                ) : (
                    <div className="flex flex-col gap-4 px-4">
                        {devices.map(d => <DeviceCard key={d.id} device={d} />)}
                    </div>
                )}
            </section>
        );

        const DeviceView = ({ device }) => (
            <section className="w-full py-2">
                <Breadcrumb items={[{label:'Devices', href:'#'}, {label: device.name}]} />
                <SectionLabel>{device.name}</SectionLabel>
                <div className="-mt-3 mb-6 px-4 text-[11px] text-zinc-400 font-mono bg-white/5 inline-block mx-4 px-2 py-0.5 rounded border border-white/10">{device.codename}</div>
                {device.roms.length === 0 ? (
                    <div className="p-8 mx-4 text-center text-xs text-zinc-500 border border-white/10 bg-white/5 rounded-xl backdrop-blur-sm">No ROMs for this device yet.</div>
                ) : (
                    <div className="flex flex-col gap-3 px-4">
                        {device.roms.map(r => <RomCard key={r.id} rom={r} deviceId={device.id} />)}
                    </div>
                )}
            </section>
        );

        const RomView = ({ device, rom }) => {
            const [copied, setCopied] = useState(false);
            const hasRecovery = rom.recoveryDownloadLink && rom.recoveryDownloadLink.length > 0;
            const hasScreenshots = rom.screenshotsLink && rom.screenshotsLink.length > 0;
            const hasAdditionalFiles = rom.additionalFiles && Array.isArray(rom.additionalFiles) && rom.additionalFiles.length > 0;
            
            const copyLink = () => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(window.location.href);
                    setCopied(true); 
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            return (
                <article className="w-full py-2">
                    <Breadcrumb items={[
                        {label:'Devices', href:'#'},
                        {label: device.name, href:`#/device/${device.id}`},
                        {label: rom.name}
                    ]} />
                    
                    <div className="p-5 mx-4 rounded-2xl border border-white/10 bg-white/[0.02] backdrop-blur-xl shadow-2xl mb-8 relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-16 bg-white/[0.03] blur-[60px] rounded-full pointer-events-none"></div>
                        
                        <header className="relative z-10">
                            <div className="flex flex-wrap items-center gap-2 mb-4 text-[10px] font-medium">
                                <span className="px-2 py-1 rounded bg-white/10 text-zinc-200 border border-white/10 shadow-sm">Android {rom.androidVersion}</span>
                                <span className="px-2 py-1 rounded bg-white/5 text-zinc-300 border border-white/5 font-mono">{rom.fileSize}</span>
                                <span className="px-2 py-1 rounded bg-white/5 text-zinc-300 border border-white/5">{rom.buildDate}</span>
                            </div>
                            
                            <h1 className="serif-display text-4xl text-zinc-50 leading-[1.1] mb-3 drop-shadow-md break-words">{rom.name}</h1>
                            
                            <div className="text-xs text-zinc-400 flex items-center gap-1.5">
                                Maintained by <Maintainer name={rom.maintainer} link={rom.maintainerLink} id={rom.maintainerId} />
                            </div>
                        </header>

                        <div className="grid grid-cols-2 gap-2 mt-6 pt-5 border-t border-white/10 relative z-10">
                            <DownloadBtn 
                                href={rom.downloadLink} 
                                title="Download ROM" 
                                icon={<IconDownload/>} 
                                className="col-span-2 text-xs py-3" 
                            />
                            {hasRecovery && <DownloadBtn variant="ghost" href={rom.recoveryDownloadLink} title="Recovery" icon={<IconBolt/>} />}
                            {hasScreenshots && <DownloadBtn variant="ghost" href={rom.screenshotsLink} title="Screenshots" icon={<IconGallery/>} />}
                            {hasAdditionalFiles && rom.additionalFiles.map((f, i) => (
                                <DownloadBtn key={i} variant="ghost" href={f.url} title={f.name} icon={<IconDownload/>} />
                            ))}
                            
                            <button onClick={copyLink} className="flex items-center justify-center w-full gap-1.5 px-3 py-2.5 text-[11px] font-medium rounded-lg border border-white/10 text-zinc-300 active:bg-white/10 transition-all backdrop-blur-sm">
                                <IconLink/>{copied ? 'Copied' : 'Share link'}
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col gap-8 px-4">
                        {rom.installationGuide && rom.installationGuide.length > 0 && (
                            <section className="space-y-3">
                                <h2 className="text-sm font-semibold text-zinc-100 flex items-center gap-1.5">
                                    <IconTerminal size={14} className="text-zinc-400"/> Installation
                                </h2>
                                <div className="p-4 rounded-xl border border-white/5 bg-white/[0.01]">
                                    <ol className="list-decimal list-outside ml-4 text-xs leading-relaxed text-zinc-400 space-y-2 marker:text-zinc-600 font-medium">
                                        {rom.installationGuide.map((step, i) => <li key={i} className="pl-1.5"><span className="text-zinc-200">{step}</span></li>)}
                                    </ol>
                                </div>
                            </section>
                        )}
                        
                        {rom.changelog && rom.changelog.length > 0 && (
                            <section className="space-y-3">
                                <h2 className="text-sm font-semibold text-zinc-100 flex items-center gap-1.5">
                                    <IconFileText size={14} className="text-zinc-400"/> Changelog
                                </h2>
                                <div className="p-4 rounded-xl border border-white/5 bg-white/[0.01]">
                                    <ul className="list-disc list-outside ml-4 text-xs leading-relaxed text-zinc-400 space-y-1.5 marker:text-zinc-600">
                                        {rom.changelog.map((c, i) => <li key={i} className="pl-1.5"><span className="text-zinc-300">{c}</span></li>)}
                                    </ul>
                                </div>
                            </section>
                        )}
                        
                        {rom.bugs && rom.bugs.length > 0 && (
                            <section className="space-y-3">
                                <h2 className="text-sm font-semibold text-zinc-100 flex items-center gap-1.5">
                                    <IconBug size={14} className="text-zinc-400"/> Known issues
                                </h2>
                                <div className="p-4 rounded-xl border border-red-900/20 bg-red-950/10">
                                    <ul className="list-disc list-outside ml-4 text-xs leading-relaxed text-zinc-400 space-y-1.5 marker:text-red-900/50">
                                        {rom.bugs.map((b, i) => <li key={i} className="pl-1.5"><span className="text-red-200/80">{b}</span></li>)}
                                    </ul>
                                </div>
                            </section>
                        )}
                    </div>

                    <div className="mt-10 pt-6 pb-6 border-t border-white/10 text-center px-4">
                        <a href={`#/device/${device.id}`} className="inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500 active:text-zinc-200 transition-colors px-3 py-2 rounded-lg active:bg-white/5">
                            <IconBack size={12}/> Back to {device.name}
                        </a>
                    </div>
                </article>
            );
        };

        const MaintainerView = ({ profile, devices }) => {
            const initials = (profile.displayName || '?').trim().slice(0,2).toUpperCase();
            const accent = profile.accentColor || '#7c5cff';
            const maintained = [];
            devices.forEach(d => d.roms.forEach(r => {
                if (r.maintainerId === profile.id) maintained.push({ device:d, rom:r });
            }));

            return (
                <section className="w-full py-2">
                    <Breadcrumb items={[{label:'Devices', href:'#'}, {label: profile.displayName}]} />

                    <div className="mx-4 rounded-2xl border border-white/10 bg-white/[0.02] backdrop-blur-xl shadow-2xl overflow-hidden">
                        <div className="p-5">
                            <div className="flex items-start gap-4">
                                <div className="relative shrink-0">
                                    {profile.avatar ? (
                                        <img src={profile.avatar} alt="" loading="lazy" decoding="async"
                                            className="w-20 h-20 rounded-full object-cover border-4 border-[#050505] bg-zinc-900"
                                            style={{ boxShadow: `0 0 0 1px ${accent}40` }} />
                                    ) : (
                                        <div className="w-20 h-20 rounded-full border-4 border-[#050505] flex items-center justify-center text-zinc-50 font-semibold text-xl"
                                            style={{ backgroundColor: accent }}>{initials}</div>
                                    )}
                                </div>
                                <div className="min-w-0 flex-1 pt-1">
                                    <h1 className="serif-display text-3xl text-zinc-50 leading-tight drop-shadow-md break-words">{profile.displayName}</h1>
                                    <div className="mt-0.5 text-[11px] font-mono text-zinc-400 break-all">{profile.tag}</div>
                                    {profile.pronouns && (
                                        <div className="mt-1 text-[10px] text-zinc-500">{profile.pronouns}</div>
                                    )}
                                </div>
                            </div>

                            {profile.bio && (
                                <div className="mt-4">
                                    <div className="text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-2">About me</div>
                                    <p className="text-xs leading-relaxed text-zinc-300">{profile.bio}</p>
                                </div>
                            )}

                            {profile.badges && profile.badges.length > 0 && (
                                <div className="mt-4">
                                    <div className="text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-2">Badges</div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {profile.badges.map((b,i) => (
                                            <span key={i} className="inline-flex items-center gap-1 px-2 py-1 rounded bg-white/5 border border-white/10 text-[10px] font-medium text-zinc-200">
                                                <IconBadge size={10}/>{b}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {profile.links && profile.links.length > 0 && (
                                <div className="mt-4">
                                    <div className="text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-2">Connections</div>
                                    <div className="flex flex-col gap-1.5">
                                        {profile.links.map((l,i) => (
                                            <SmartLink key={i} href={l.url}
                                                className="flex items-center justify-between px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-xs text-zinc-200 active:bg-white/10 transition-all">
                                                <span className="inline-flex items-center gap-1.5"><IconLink size={12}/>{l.label}</span>
                                                <IconExternal size={12}/>
                                            </SmartLink>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="mt-8 px-4">
                        <h2 className="text-sm font-semibold text-zinc-100 flex items-center gap-1.5 mb-3">
                            <IconStack size={14} className="text-zinc-400"/> Maintained ROMs
                            <span className="text-[10px] font-medium text-zinc-500">({maintained.length})</span>
                        </h2>
                        {maintained.length === 0 ? (
                            <div className="p-6 text-center text-xs text-zinc-500 border border-white/10 bg-white/5 rounded-xl">No ROMs yet.</div>
                        ) : (
                            <div className="flex flex-col gap-3">
                                {maintained.map(({device,rom}) => (
                                    <a key={`${device.id}-${rom.id}`} href={`#/device/${device.id}/rom/${rom.id}`}
                                        className="block p-4 rounded-xl border border-white/10 bg-white/[0.02] active:bg-white/[0.04] active:border-white/20 transition-all">
                                        <div className="flex items-start justify-between gap-3">
                                            <div className="min-w-0 flex-1">
                                                <div className="text-sm font-medium text-zinc-100 leading-snug">{rom.name}</div>
                                                <div className="text-[10px] text-zinc-500 mt-1">{device.name} · <span className="font-mono">{device.codename}</span></div>
                                            </div>
                                            <span className="shrink-0 text-[9px] font-medium px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-white/10">Android {rom.androidVersion}</span>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const NotFound = ({ message }) => (
            <div className="w-full px-4 py-20 text-center">
                <h1 className="serif-display text-4xl text-zinc-50 mb-3 drop-shadow-md">Not found</h1>
                <p className="text-zinc-400 text-xs mb-6 font-medium">{message}</p>
                <a href="#" className="inline-flex items-center gap-1.5 px-4 py-2.5 text-xs font-medium rounded-lg bg-zinc-100 text-zinc-950 active:bg-white transition-all shadow-lg">Go home</a>
            </div>
        );

        const App = () => {
            const [romDatabase, setRomDatabase] = useState([]);
            const [profiles, setProfiles] = useState({});
            const [isLoading, setIsLoading] = useState(true);
            const [tgUrl, setTgUrl] = useState(null);
            const [usingDemo, setUsingDemo] = useState(false);
            const [route, setRoute] = useState(parseHash());

            useEffect(() => {
                openTelegramPrompt = (url) => setTgUrl(url);
                return () => { openTelegramPrompt = null; };
            }, []);

            useEffect(() => {
                const onHash = () => { setRoute(parseHash()); window.scrollTo({top:0, behavior:'instant'}); };
                window.addEventListener('hashchange', onHash);
                return () => window.removeEventListener('hashchange', onHash);
            }, []);

            useEffect(() => {
                fetch('./res/data.json')
                    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) setRomDatabase(data);
                        else { setRomDatabase(DEMO_DATA); setUsingDemo(true); }
                        setIsLoading(false);
                    })
                    .catch(() => { setRomDatabase(DEMO_DATA); setUsingDemo(true); setIsLoading(false); });
            }, []);

            useEffect(() => {
                fetch('./res/maintainers.json')
                    .then(r => r.ok ? r.json() : {})
                    .then(data => {
                        const obj = (data && typeof data === 'object' && !Array.isArray(data)) ? data : {};
                        PROFILES = obj;
                        setProfiles(obj);
                    })
                    .catch(() => {});
            }, []);

            const device = route.deviceId ? romDatabase.find(d => d.id === route.deviceId) : null;
            const rom = device && route.romId ? device.roms.find(r => r.id === route.romId) : null;
            const profile = route.maintainerId ? profiles[route.maintainerId] : null;

            return (
                <div className="min-h-screen flex flex-col">
                    <Header />
                    {usingDemo && (
                        <div className="w-full px-4 pt-4">
                            <div className="p-3 rounded-xl bg-orange-950/20 border border-orange-900/30 text-[10px] font-medium text-orange-200/80 shadow-sm backdrop-blur-md flex items-center gap-2">
                                <IconBolt size={12} /> Preview mode · (res/data.json not found)
                            </div>
                        </div>
                    )}
                    <main key={`${route.view}-${route.deviceId || ''}-${route.romId || ''}-${route.maintainerId || ''}`} className="animate-fade-in flex-1">
                        {isLoading ? (
                            <div className="w-full px-4 py-20 text-center text-zinc-500 text-xs font-medium">Loading repository...</div>
                        ) : route.view === 'home' ? (
                            <HomeView devices={romDatabase} />
                        ) : route.view === 'device' ? (
                            device ? <DeviceView device={device} /> : <NotFound message="That device doesn't exist." />
                        ) : route.view === 'rom' ? (
                            (device && rom) ? <RomView device={device} rom={rom} /> : <NotFound message="That ROM doesn't exist." />
                        ) : route.view === 'maintainer' ? (
                            profile ? <MaintainerView profile={profile} devices={romDatabase} /> : <NotFound message="That maintainer doesn't exist." />
                        ) : <NotFound message="Page not found." />}
                    </main>
                    {tgUrl && <TelegramModal url={tgUrl} onClose={() => setTgUrl(null)} />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
